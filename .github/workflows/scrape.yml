name: Scrape daily job wages

on:
  schedule:
    # 01:00 JST (16:00 UTC on the preceding day)
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      prefectures:
        description: "Comma-separated prefectures (blank means all 47)"
        required: false
        type: string
      occupations:
        description: "Comma-separated occupations (blank means all target occupations)"
        required: false
        type: string
      max_rows:
        description: "Maximum rows for debug (blank means unlimited)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: daily-job-wage-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect public job metadata
        env:
          PREFECTURES: ${{ inputs.prefectures }}
          OCCUPATIONS: ${{ inputs.occupations }}
          MAX_ROWS: ${{ inputs.max_rows }}
        run: |
          args=()

          if [[ -n "$PREFECTURES" ]]; then
            args+=(--prefectures "$PREFECTURES")
          fi

          if [[ -n "$OCCUPATIONS" ]]; then
            args+=(--occupations "$OCCUPATIONS")
          fi

          if [[ -n "$MAX_ROWS" ]]; then
            args+=(--max-rows "$MAX_ROWS")
          fi

          python scraper.py "${args[@]}"
      - name: Commit updated data
        run: |
          git add data/daily

          if git diff --cached --quiet -- data/daily; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update job wage data $(TZ=Asia/Tokyo date +%F)"

          branch="${GITHUB_REF#refs/heads/}"
          git pull --rebase origin "$branch"
          git push origin "HEAD:$branch"
